name: ProjectTabi Release Packages

on:
  workflow_dispatch:
  push:
    branches: ['codex/in-app-updater']
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Check release tag matches app version
        id: metadata
        run: python3 tool/release_metadata.py
      - name: Restore persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/restore_android_signing.py --require
      - run: flutter pub get
      - name: Analyze update integration
        run: flutter analyze lib/update lib/app_version.dart lib/main.dart lib/settings/settings_screen.dart lib/sync/sync_guard_repository.dart
      - name: Build Android package
        run: flutter build apk --release --no-pub
      - name: Find previous release APK
        if: startsWith(github.ref, 'refs/tags/v')
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName --jq 'map(select(.tagName != env.GITHUB_REF_NAME)) | .[0].tagName // ""' || true)"
          if [ -n "$previous_tag" ]; then
            mkdir -p previous-apk
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern 'ProjectTabi-*.apk' --dir previous-apk
            previous_apk="$(find previous-apk -type f -name 'ProjectTabi-*.apk' | head -n 1)"
            echo "path=$previous_apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Android package identity and update signature
        env:
          PREVIOUS_APK: ${{ steps.previous.outputs.path }}
        run: |
          current_apk=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$PREVIOUS_APK" ]; then
            bash tool/check_android_update.sh "$current_apk" "$PREVIOUS_APK"
          else
            bash tool/check_android_update.sh "$current_apk"
          fi
      - name: Package APK
        env:
          PACKAGE_STEM: ${{ steps.metadata.outputs.stem }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "$PACKAGE_STEM.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: projecttabi-android
          path: ProjectTabi-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag matches app version
        id: metadata
        run: python tool/release_metadata.py
      - run: flutter pub get
      - run: npm ci
      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build
      - name: Save resolved desktop dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projecttabi-cargo-lock
          path: src-tauri/Cargo.lock
      - name: Package Windows setup
        shell: pwsh
        env:
          PACKAGE_STEM: ${{ steps.metadata.outputs.stem }}
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Tauri NSIS installer was not created.' }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw 'Windows updater signature was not created.' }
          Copy-Item $installer.FullName "$env:PACKAGE_STEM-windows-setup.exe"
          Copy-Item $signature "$env:PACKAGE_STEM-windows-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: projecttabi-windows
          path: |
            ProjectTabi-*-windows-setup.exe
            ProjectTabi-*-windows-setup.exe.sig

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: projecttabi-*
      - name: Generate update feed and release notes
        run: python3 tool/release_metadata.py --assets release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ProjectTabi-*
            release-assets/latest.json
          body_path: RELEASE_NOTES.md
          name: ProjectTabi ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
