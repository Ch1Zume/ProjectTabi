name: ProjectTabi Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$app_version" = "$tag_version" || { echo "Tag $tag_version must match pubspec version $app_version"; exit 1; }
      - name: Restore persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/restore_android_signing.py --require
      - run: flutter pub get
      - name: Build Android package
        run: flutter build apk --release --no-pub
      - name: Find previous release APK
        if: startsWith(github.ref, 'refs/tags/v')
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""' || true)"
          if [ -n "$previous_tag" ]; then
            mkdir -p previous-apk
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern 'ProjectTabi-*.apk' --dir previous-apk
            previous_apk="$(find previous-apk -type f -name 'ProjectTabi-*.apk' | head -n 1)"
            echo "path=$previous_apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Android package identity and update signature
        env:
          PREVIOUS_APK: ${{ steps.previous.outputs.path }}
        run: |
          current_apk=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$PREVIOUS_APK" ]; then
            bash tool/check_android_update.sh "$current_apk" "$PREVIOUS_APK"
          else
            bash tool/check_android_update.sh "$current_apk"
          fi
      - name: Package APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "ProjectTabi-$GITHUB_REF_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: projecttabi-android
          path: ProjectTabi-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$app_version" = "$tag_version" || { echo "Tag $tag_version must match pubspec version $app_version"; exit 1; }
      - run: flutter pub get
      - run: npm ci
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Package Windows setup
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Tauri NSIS installer was not created.' }
          Copy-Item $installer.FullName "ProjectTabi-$env:GITHUB_REF_NAME-windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: projecttabi-windows
          path: ProjectTabi-*-windows-setup.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
