name: Camera quality checks

on:
  push:
    branches: ['codex/camera-quality']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check camera Dart code
        run: flutter analyze lib/camera_reference/camera_quality_sheet.dart lib/camera_reference/camerawesome_reference_screen.dart test/camera_quality_sheet_test.dart
      - name: Camera and record regression tests
        run: flutter test test/camera_quality_sheet_test.dart test/camera_capture_aspect_ratio_test.dart test/camera_storage_test.dart test/visit_record_confirmation_screen_test.dart test/visit_record_gallery_backup_test.dart test/photo_location_test.dart test/platform_version_consistency_test.dart
      - name: Compile Android camera integration
        env:
          PROJECT_TABI_UNSIGNED_CHECK: '1'
        run: flutter build apk --release --no-pub
      - name: Lens selection and enhancement fallback tests
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest --tests 'com.ch1zume.projecttabi.CameraQualityPolicyTest'
