[package]
name = "projecttabi-desktop"
version = "0.1.2+4"
description = "ProjectTabi desktop launcher"
authors = ["Ch1Zume"]
license = "MIT"
repository = "https://github.com/Ch1Zume/ProjectTabi"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
rfd = "0.15"
reqwest = { version = "0.13", features = ["blocking", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
webkit2gtk = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.61", features = ["Networking_Connectivity"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
